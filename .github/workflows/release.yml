name: Release

# This package has no pub.dev publish step (publish_to: 'none' in
# pubspec.yaml) — it's consumed as a git dependency, so a "release" here is
# a tagged, checked commit that daily_routine's pubspec.yaml can pin to
# (git: {url: ..., ref: vX.Y.Z}) instead of floating on `main`.
#
# To cut a release: bump `version:` in pubspec.yaml, merge to main, then
# push a matching tag:
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history + tags) — actions/checkout's default
      # shallow (depth-1) clone doesn't fetch the tag ref in a way `gh
      # release create` recognizes, causing a spurious "tag exists locally
      # but has not been pushed" error even though the tag triggered this
      # exact run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter analyze

      - name: Verify tag matches pubspec.yaml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version ($PUBSPEC_VERSION)."
            exit 1
          fi

      # This repo pushes straight to main instead of merging PRs, so `gh
      # release create --generate-notes` (which summarizes merged PRs) has
      # nothing to list and produces an almost-empty body — just a compare
      # link. Real "what changed" content only exists in commit messages,
      # so build the notes from `git log` between the previous tag and this
      # one instead.
      - name: Build release notes from commit history
        run: |
          PREV_TAG="$(git tag --sort=v:refname | grep -B1 -x "$GITHUB_REF_NAME" | head -1)"
          if [ "$PREV_TAG" = "$GITHUB_REF_NAME" ]; then
            git log --reverse --pretty=format:'- %s' "$GITHUB_REF_NAME" > /tmp/release-notes.md
          else
            git log --reverse --pretty=format:'- %s' "$PREV_TAG".."$GITHUB_REF_NAME" > /tmp/release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md

      # Prepends the same commit-history notes to a CHANGELOG.md committed
      # to the repo, so "what changed" is written once, automatically,
      # right here — not by hand in a commit message after the fact.
      - name: Update CHANGELOG.md
        run: |
          DATE="$(date -u +%Y-%m-%d)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          {
            echo "## $GITHUB_REF_NAME — $DATE"
            echo ""
            cat /tmp/release-notes.md
            echo ""
            echo ""
            if [ -f CHANGELOG.md ]; then cat CHANGELOG.md; fi
          } > /tmp/CHANGELOG.new
          mv /tmp/CHANGELOG.new CHANGELOG.md

          git add CHANGELOG.md
          git commit -m "Update CHANGELOG.md for $GITHUB_REF_NAME [skip ci]"
          git push origin main
