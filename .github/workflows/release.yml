name: Release

# This package has no pub.dev publish step (publish_to: 'none' in
# pubspec.yaml) — it's consumed as a git dependency, so a "release" here is
# a tagged, checked commit that daily_routine's pubspec.yaml can pin to
# (git: {url: ..., ref: vX.Y.Z}) instead of floating on `main`.
#
# Two ways to cut a release, after bumping `version:` in pubspec.yaml and
# merging to main:
#   1. Manual trigger (Actions tab → Release → Run workflow), giving the
#      version (e.g. 0.2.0, no leading "v") — this workflow creates and
#      pushes the signed tag itself, using the same commit-signing key it
#      already holds for CHANGELOG.md commits. No local git/GPG needed.
#   2. Push a signed, annotated tag yourself (`-s` requires git configured
#      with your own signing key; a plain lightweight `git tag` is never
#      GPG-signed even with tag.gpgsign=true, so it won't show as Verified
#      on GitHub):
#        git tag -s -m v0.2.0 v0.2.0 && git push origin v0.2.0

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match pubspec.yaml's version), e.g. 0.2.0 — no leading v"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history + tags) — actions/checkout's default
      # shallow (depth-1) clone doesn't fetch the tag ref in a way `gh
      # release create` recognizes, causing a spurious "tag exists locally
      # but has not been pushed" error even though the tag triggered this
      # exact run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter analyze

      # Imported early (not just before the CHANGELOG step, as before) —
      # a manual trigger also needs it to sign the release tag itself,
      # below, before any of the tag-dependent steps run.
      - name: Import commit-signing GPG key
        run: echo "${{ secrets.COMMIT_SIGNING_KEY }}" | gpg --batch --import

      - name: Determine release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=v${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi

      - name: Verify tag matches pubspec.yaml version
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          PUBSPEC_VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::$TAG_NAME does not match pubspec.yaml version ($PUBSPEC_VERSION)."
            exit 1
          fi

      # Only for a manual trigger — a tag push already did this itself.
      # Signed with the same commit-signing key imported above, so it
      # shows as Verified, same as a tag you'd sign and push yourself.
      - name: Create and push the release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "kasinadhsarma"
          git config user.email "218753575+ghostsvector@users.noreply.github.com"
          git tag -u EFCAFE4A6CE496E560DB3BE8C467E1EB7AFCC640 -m "$TAG_NAME" "$TAG_NAME"
          git push origin "$TAG_NAME"

      # This repo pushes straight to main instead of merging PRs, so `gh
      # release create --generate-notes` (which summarizes merged PRs) has
      # nothing to list and produces an almost-empty body — just a compare
      # link. Real "what changed" content only exists in commit messages,
      # so build the notes from `git log` between the previous tag and this
      # one instead.
      - name: Build release notes from commit history
        run: |
          PREV_TAG="$(git tag --sort=v:refname | grep -B1 -x "$TAG_NAME" | head -1)"
          if [ "$PREV_TAG" = "$TAG_NAME" ]; then
            git log --reverse --pretty=format:'- %s' "$TAG_NAME" > /tmp/release-notes.md
          else
            git log --reverse --pretty=format:'- %s' "$PREV_TAG".."$TAG_NAME" > /tmp/release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file /tmp/release-notes.md

      # Prepends the same commit-history notes to a CHANGELOG.md committed
      # to the repo, so "what changed" is written once, automatically,
      # right here — not by hand in a commit message after the fact.
      - name: Update CHANGELOG.md
        run: |
          DATE="$(date -u +%Y-%m-%d)"

          git config user.name "kasinadhsarma"
          git config user.email "218753575+ghostsvector@users.noreply.github.com"
          git config user.signingkey "EFCAFE4A6CE496E560DB3BE8C467E1EB7AFCC640"
          git config commit.gpgsign true
          git fetch origin main
          git checkout -B main origin/main

          {
            echo "## $TAG_NAME — $DATE"
            echo ""
            cat /tmp/release-notes.md
            echo ""
            echo ""
            if [ -f CHANGELOG.md ]; then cat CHANGELOG.md; fi
          } > /tmp/CHANGELOG.new
          mv /tmp/CHANGELOG.new CHANGELOG.md

          git add CHANGELOG.md
          git commit -m "Update CHANGELOG.md for $TAG_NAME [skip ci]"
          git push origin main
