name: Release

# This package has no pub.dev publish step (publish_to: 'none' in
# pubspec.yaml) — it's consumed as a git dependency, so a "release" here is
# a tagged, checked commit that daily_routine's pubspec.yaml can pin to
# (git: {url: ..., ref: vX.Y.Z}) instead of floating on `main`.
#
# To cut a release: bump `version:` in pubspec.yaml, merge to main, then
# push a matching tag:
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history + tags) — actions/checkout's default
      # shallow (depth-1) clone doesn't fetch the tag ref in a way `gh
      # release create` recognizes, causing a spurious "tag exists locally
      # but has not been pushed" error even though the tag triggered this
      # exact run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter analyze

      - name: Verify tag matches pubspec.yaml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version ($PUBSPEC_VERSION)."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      # Copies GitHub's auto-generated release notes (commits since the
      # last tag) into a CHANGELOG.md committed to the repo, so "what
      # changed" is written once, automatically, right here — not by hand
      # in a commit message or PR description after the fact. Runs after
      # the release exists so `gh release view` can read back what
      # --generate-notes actually produced, rather than recomputing it.
      - name: Update CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(gh release view "$GITHUB_REF_NAME" --json body -q .body)"
          DATE="$(date -u +%Y-%m-%d)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          {
            echo "## $GITHUB_REF_NAME — $DATE"
            echo ""
            echo "$NOTES"
            echo ""
            if [ -f CHANGELOG.md ]; then cat CHANGELOG.md; fi
          } > /tmp/CHANGELOG.new
          mv /tmp/CHANGELOG.new CHANGELOG.md

          git add CHANGELOG.md
          git commit -m "Update CHANGELOG.md for $GITHUB_REF_NAME [skip ci]"
          git push origin main
